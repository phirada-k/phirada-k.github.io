<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFX Works</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/vfx.css">
</head>
<body>
    <div class="accent orange accent-vfx-top"></div>
    <div class="accent blue accent-vfx-mid"></div>
    <div class="accent orange accent-vfx-mid1"></div>
    <div class="accent orange accent-vfx-mid2"></div>
    <div class="accent blue accent-vfx-bottom"></div>
    <main>
        <div id="header-v2"></div>

    <div class="video-container">
      <iframe class="videoVimeo" title="vimeo-player" 
        src="https://player.vimeo.com/video/905012038?autoplay=1&muted=1" 
        frameborder="0" allowfullscreen></iframe>
    </div>

    <div id="videoGallery">
      <!-- Repeat this block for each video -->
      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/Instigators.jpg" loading="lazy">

      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/Supacell.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/Supacell.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/comotion-phirada-1.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/comotion-phirada-1.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/comotion-phirada-2.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/comotion-phirada-2.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/comotion-phirada-3.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/comotion-phirada-3.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/comotion-phirada-4.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/comotion-phirada-4.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/library-breakdown.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/library-breakdown.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/FlyingShipV01.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/FlyingShipV01.mp4" type="video/mp4">
      </video>

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/dandelionBlow.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/dandelionBlow.mp4" type="video/mp4">

      <video class="videoVFX" preload="none" muted playsinline poster="../images/vfx/posters/dryIce.jpg" loading="lazy">
        <source data-src="../images/vfx/videos/dryIce.mp4" type="video/mp4">

        <source data-src="../images/vfx/videos/For_IG_FinalRender.mp4" type="video/mp4">
      </video>
    </div>
  </main>

  <script>
  // Enable video controls on hover
  document.addEventListener("mouseover", e => {
    if (e.target.tagName === "VIDEO") e.target.setAttribute("controls", "true");
  });
  document.addEventListener("mouseout", e => {
    if (e.target.tagName === "VIDEO") e.target.removeAttribute("controls");
  });

  // Lazy load videos
  document.addEventListener("DOMContentLoaded", function() {
    const videos = document.querySelectorAll("video");

    const videoObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const video = entry.target;
          const source = video.querySelector("source");
          if (source && !source.src) {
            source.src = source.dataset.src;
            video.load();
            video.play();
          }
          observer.unobserve(video);
        }
      });
    });

    videos.forEach(video => {
      videoObserver.observe(video);
    });
  });

    document.querySelectorAll('.videoVFX').forEach(video => {
        video.addEventListener('mouseenter', () => {
            video.setAttribute('controls', 'true');
        });
        video.addEventListener('mouseleave', () => {
            video.removeAttribute('controls');
        });
    });
    </script>
    <div id="footer"></div>
<script src="../js/header-v2.js"></script>
<script src="../js/footer.js"></script>
<script src="../js/menu-icon.js"></script>
</body>
</html>
